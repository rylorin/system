# Core system services for my VPS

services:
  
  authelia:
    image: authelia/authelia:latest
    volumes:
      - /root/system/volumes/authelia:/config/:rw
    ports:
      - 9091:9091/tcp
    networks:
      - dmz_network
      
  bind:
    image: sameersbn/bind:latest
    environment:
      ROOT_PASSWORD: ${ROOT_PASSWORD}
    volumes:
      - bind_data_nfs:/data:rw
    ports:
        - 53:53/tcp
        - 53:53/udp
        - 10000:10000/tcp
    deploy:
      placement:
        constraints:
          - node.platform.os == linux
          - node.role == manager
#          - node.role == worker
      replicas: 0
      
  smtp:
    image: rylorin/postfix-relay:latest
    environment:
      POSTFIX_virtual_alias_domains: villamilawines.com 123-group.com
    configs:
      - source: virtual
        target: /etc/postfix/conf.d/virtual
    ports:
      - 25:25/tcp
    deploy:
      placement:
        constraints:
          - node.platform.os == linux
      replicas: 0
      
  websites:
    image: caddy:2.11.4
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80/tcp
      - 443:443/tcp
    volumes:
      - core_sslcerts:/data/:rw
      - web:/usr/share/caddy/:ro
    networks:
      # connect to our DMZ network 
      - dmz_network
      # portainer_agent_network is necessary to reverse proxy to portainer web interface
      - portainer_agent_network
    configs:
      - source: Caddyfile
        target: /etc/caddy/Caddyfile
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
    
networks:
  dmz_network:
    driver: overlay
    attachable: true
  portainer_agent_network:
    external: true
  host:
    name: host
    external: true
    
configs:
  Caddyfile:
    external: true
    name: "${CADDYFILE:-system_Caddyfile}"
  virtual:
    external: true

volumes:
  web:
  core_sslcerts:
    external: true
  bind_data_nfs:
    external: true
